services:
  db:
    image: postgres:16-alpine
    container_name: jerney-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jerney_db
      POSTGRES_USER: jerney_user
      POSTGRES_PASSWORD: jerney_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerney_user -d jerney_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME:-gurramrahul}/jerney-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: jerney-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jerney_user
      DB_PASSWORD: jerney_pass_2026
      DB_NAME: jerney_db
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME:-gurramrahul}/jerney-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    container_name: jerney-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: